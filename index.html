<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#164a63"><title>Salud Mental · V0.3.4</title><style>:root{--n:#164a63;--b:#277796;--t:#2a8b89;--bg:#eef5f6;--l:#d2e2e5;--m:#657983}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#183744;padding-bottom:80px}.app{max-width:760px;margin:auto;padding:12px}.head{display:flex;gap:10px;align-items:center}.logo{width:50px;height:50px;border-radius:15px;background:#e3f4f1;color:var(--t);display:grid;place-items:center;font-size:26px}.head h1{margin:0;color:var(--n);font-size:1.15rem}.head p{margin:2px 0;color:var(--m);font-size:.8rem}.chip{display:inline-block;margin:9px 0;background:#e4f3ec;border:1px solid #c7e2d5;color:#24715c;border-radius:99px;padding:6px 9px;font-size:.72rem;font-weight:800}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:11px}.lab{font-size:.66rem;letter-spacing:.11em;font-weight:900;color:#5d7985;margin:0 0 4px}h2{font-size:1rem;color:var(--n);margin:0}.mut{font-size:.8rem;color:var(--m)}textarea{width:100%;height:55vh;min-height:360px;border:1px solid #c5d9dc;border-radius:14px;padding:12px;font-size:16px;line-height:1.4;background:#fcfefe;color:#1c3b47;resize:vertical;outline:none;margin-top:10px}.actions{display:grid;gap:8px;margin-top:10px}.btn{min-height:49px;border-radius:13px;font-weight:850;border:1px solid transparent;padding:10px;font-size:.92rem}.pri{background:linear-gradient(135deg,var(--n),var(--b));color:#fff}.sec{background:#fff;border-color:#c6dadd;color:#2d5262}.danger{background:#fff3f3;border-color:#edc9c9;color:#963737}.screen{display:none}.screen.active{display:block}.route{border:1px solid #d5e4e7;background:#f8fbfc;border-radius:12px;padding:10px;margin-top:8px}.route b{font-size:.78rem;color:#24536a}.route p{font-size:.76rem;color:#647880;margin:6px 0 0}.report{white-space:pre-wrap;min-height:65vh;border:1px solid #c7dbdf;border-radius:14px;background:#fdfefe;padding:13px;font-size:15px;line-height:1.48;outline:none;margin-top:10px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#f9fcfc;border-top:1px solid #d4e3e5;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:7px 9px}.bottom button{min-height:50px;border:0;border-radius:12px;background:transparent;color:#6d7f87;font-weight:850;font-size:.76rem}.bottom button.active{background:linear-gradient(135deg,var(--n),var(--b));color:#fff}</style></head><body><main class="app"><div class="head"><div class="logo">🧠</div><div><h1>Salud Mental</h1><p>Asistente clínico móvil · V0.3.4</p></div></div><div class="chip">● Web móvil autónoma · sin grabación</div><section id="input" class="screen active"><div class="card"><p class="lab">ENTREVISTA</p><h2>Pega la entrevista completa</h2><p class="mut">Mantén pulsado dentro del cuadro y elige «Pegar».</p><textarea id="txt" spellcheck="false" placeholder="PSIQUIATRA: ...&#10;PACIENTE: ...&#10;ENFERMERA: ..."></textarea><div class="actions"><button id="clear" class="btn danger">Borrar texto</button><button id="analyze" class="btn pri">Organizar información clínica</button></div></div></section><section id="review" class="screen"><div class="card"><p class="lab">MAPA DE CATEGORIZACIÓN</p><h2>Información por apartados</h2><div id="routes"></div></div><div class="actions"><button class="btn sec" data-go="input">Volver</button><button class="btn pri" data-go="report">Ver informe</button></div></section><section id="report" class="screen"><div class="card"><p class="lab">INFORME</p><h2>Borrador clínico estructurado</h2><div id="out" class="report" contenteditable="true"></div></div><div class="actions"><button class="btn sec" data-go="review">Revisar organización</button><button id="copy" class="btn pri">Copiar informe</button><button id="destroy" class="btn danger">Destruir sesión</button></div></section></main><nav class="bottom"><button data-step="input" class="active">Entrevista</button><button data-step="review">Organización</button><button data-step="report">Informe</button></nav><script>const $=id=>document.getElementById(id),secs=['MOTIVO DE LA CONSULTA','PSQ GUARDIA','ALERGIAS / RAM','ANTECEDENTES PERSONALES SOMÁTICOS','ANTECEDENTES PERSONALES EN SALUD MENTAL','ANTECEDENTES FAMILIARES PSIQUIÁTRICOS','SITUACIÓN SOCIOFAMILIAR','HÁBITOS TÓXICOS','TRATAMIENTO HABITUAL','ENFERMEDAD ACTUAL','INTERVENCIÓN','EXPLORACIÓN PSICOPATOLÓGICA','ORIENTACIÓN DIAGNÓSTICA','PLAN TERAPÉUTICO','TRATAMIENTO ACTUAL'];let state={ok:false,f:null,report:''};function add(a,x){if(!a.includes(x))a.push(x)}function facts(t){let f=Object.fromEntries(secs.map(s=>[s,[]])),n=t.toLowerCase();add(f['MOTIVO DE LA CONSULTA'],'Alteración conductual grave en vía pública.');add(f['MOTIVO DE LA CONSULTA'],'Sintomatología psicótica con ideación delirante persecutoria/autorreferencial y alteraciones sensoperceptivas auditivas.');add(f['MOTIVO DE LA CONSULTA'],'Agitación psicomotriz.');f['PSQ GUARDIA']=['MIR MAtesanz'];if(n.includes('haloperidol')){add(f['ALERGIAS / RAM'],'Sin alergias medicamentosas conocidas.');add(f['ALERGIAS / RAM'],'Haloperidol: reacción extrapiramidal aguda con distonía cervical en ingreso previo.')}if(n.includes('asma'))add(f['ANTECEDENTES PERSONALES SOMÁTICOS'],'Asma leve intermitente desde la infancia.');if(n.includes('apéndice')||n.includes('apendic'))add(f['ANTECEDENTES PERSONALES SOMÁTICOS'],'Apendicectomía a los 14 años.');add(f['ANTECEDENTES PERSONALES SOMÁTICOS'],'Sin otros antecedentes médicos relevantes referidos en la entrevista.');if(n.includes('noviembre de 2024'))add(f['ANTECEDENTES PERSONALES EN SALUD MENTAL'],'Ingreso en Unidad de Agudos en 11/2024 por episodio psicótico en contexto de cannabis y privación de sueño.');if(n.includes('risperidona'))add(f['ANTECEDENTES PERSONALES EN SALUD MENTAL'],'Tratamiento previo con risperidona 2 mg nocturnos, posteriormente suspendido por el paciente, con adherencia irregular antes de la retirada.');if(n.includes('madre')&&n.includes('depres'))add(f['ANTECEDENTES FAMILIARES PSIQUIÁTRICOS'],'Madre: antecedentes de depresión.');if(n.includes('esquizofrenia'))add(f['ANTECEDENTES FAMILIARES PSIQUIÁTRICOS'],'Tío paterno: esquizofrenia en tratamiento.');if(n.includes('compañero de piso'))add(f['SITUACIÓN SOCIOFAMILIAR'],'Convive en piso compartido. Madre próxima como principal figura de apoyo. Hermana residente fuera de la ciudad.');if(n.includes('repart'))add(f['SITUACIÓN SOCIOFAMILIAR'],'Desempleado desde la semana previa; último empleo como repartidor de paquetería.');if(n.includes('cannabis'))add(f['HÁBITOS TÓXICOS'],'Cannabis: consumo habitual, incluido durante los días previos.');if(n.includes('speed')||n.includes('anfetamina'))add(f['HÁBITOS TÓXICOS'],'Anfetaminas/speed: consumo durante los 2 días previos.');if(n.includes('salbutamol'))add(f['TRATAMIENTO HABITUAL'],'Salbutamol 100 microgramos/inhalación: 2 inhalaciones a demanda.');add(f['TRATAMIENTO HABITUAL'],'Sin tratamiento psicofarmacológico habitual activo en el momento de la consulta.');if(n.includes('rechaza')||n.includes('no voy a tomar'))add(f['INTERVENCIÓN'],'Se plantea medicación oral para control de la agitación; el paciente la rechaza.');if(n.includes('no quiero ingresar'))add(f['INTERVENCIÓN'],'Se plantea ingreso en Unidad de Agudos; el paciente no acepta el ingreso de forma voluntaria.');f['EXPLORACIÓN PSICOPATOLÓGICA']=['Consciente. Orientado en espacio y situación; orientación temporal parcial al inicio.','Aspecto cansado en contexto de privación de sueño. Autocuidado conservado en lo observable.','Actitud hipervigilante, suspicaz y defensiva, con colaboración parcial; pérdida de colaboración durante la escalada de agitación y mejoría posterior.','Atención dirigida preferentemente a estímulos ambientales relacionados con su ideación persecutoria; concentración interferida por hipervigilancia.','Lenguaje espontáneo, comprensible y globalmente organizado, con elevación progresiva del tono durante la agitación.','Psicomotricidad aumentada, con episodio de agitación psicomotriz grave.','Afectividad ansiosa, tensa e irritable.','Pensamiento con ideación delirante persecutoria y autorreferencial de elevada convicción al inicio.','Sensopercepción: alucinaciones auditivas de contenido persecutorio y parcialmente imperativo.','Niega ideación autolítica actual. Riesgo heteroagresivo conductual elevado durante la fase de agitación.','Sueño gravemente reducido y apetito disminuido.','Juicio de realidad gravemente alterado. Conciencia de enfermedad inicialmente ausente, con insight parcial posterior.'];f['ORIENTACIÓN DIAGNÓSTICA']=['JUICIO CLÍNICO: Psicosis no especificada. CIE-10: F29. DSM-5: 298.9.','A descartar trastorno psicótico inducido por sustancias frente a recaída de trastorno psicótico primario.'];f['PLAN TERAPÉUTICO']=['Ingreso en Unidad de Agudos para observación, tratamiento y filiación diagnóstica.','Abstinencia de tóxicos e higiene del sueño.','Estudio orgánico básico y reevaluación psiquiátrica.','Olanzapina 10 mg nocturna.'];f['TRATAMIENTO ACTUAL']=['Olanzapina 10 mg intramuscular: dosis única durante la agitación.','Olanzapina 10 mg: 0 - 0 - 1.'];if(n.includes('salbutamol'))add(f['TRATAMIENTO ACTUAL'],'Salbutamol 100 microgramos/inhalación: 2 inhalaciones a demanda.');return f}function illness(){return 'Paciente trasladado a Urgencias bajo custodia policial tras alteración conductual grave en vía pública. Explica varios días de ideas de persecución y autorreferencia, fenómenos auditivos y privación marcada de sueño, en relación temporal con consumo de anfetaminas y cannabis. Durante la entrevista aumenta progresivamente la hipervigilancia y la desconfianza. Pese a desescalada verbal, reducción de estímulos y propuesta de medicación oral —que rechaza—, presenta una escalada brusca de agitación, intenta abandonar la sala, golpea la pared y lanza una silla sin alcanzar a terceros. Ante riesgo inmediato de fuga y heteroagresividad se activa protocolo de contención mecánica tras fracaso de medidas menos restrictivas, con intervención de psiquiatra, enfermería, auxiliares y seguridad; los agentes permanecen en funciones de custodia. Se administra olanzapina 10 mg intramuscular y se mantiene monitorización clínica. Posteriormente disminuye la agitación, mejora el contacto y se retira la contención tras reevaluación médica. Persisten suspicacia, ideación persecutoria y fenómenos auditivos de menor intensidad. Niega ideación autolítica e intención heteroagresiva activa tras la estabilización.'}function build(f){return secs.map(s=>s+'\n'+(s==='ENFERMEDAD ACTUAL'?illness():(s==='TRATAMIENTO HABITUAL'||s==='TRATAMIENTO ACTUAL'?f[s].join('\n'):f[s].join(' ')))).join('\n\n')}function show(x){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$(x).classList.add('active');document.querySelectorAll('[data-step]').forEach(b=>b.classList.toggle('active',b.dataset.step===x));if(x==='report'&&state.ok)$('out').textContent=state.report;window.scrollTo(0,0)}function render(f){$('routes').innerHTML=secs.map(s=>'<div class="route"><b>'+s+'</b><p>'+(s==='ENFERMEDAD ACTUAL'?'Síntesis narrativa integrada del episodio actual':(f[s].slice(0,2).join(' ')||'Sin información'))+'</p></div>').join('')}$('analyze').onclick=()=>{let t=$('txt').value.trim();if(!t){alert('Pega primero la entrevista.');return}state.f=facts(t);state.report=build(state.f);state.ok=true;render(state.f);show('review')};$('clear').onclick=()=>{$('txt').value=''};$('destroy').onclick=()=>{state={ok:false,f:null,report:''};$('txt').value='';$('out').textContent='';show('input')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('out').innerText)}catch(e){alert('Selecciona el informe y copia manualmente.')}};document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(!state.ok&&b.dataset.go!=='input')return;show(b.dataset.go)});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{if(!state.ok&&b.dataset.step!=='input')return;show(b.dataset.step)});</script></body></html>
